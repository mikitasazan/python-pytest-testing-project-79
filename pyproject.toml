[project]
name = "hexlet-code"
version = "0.1.0"
description = "PageLoader — a CLI utility that downloads a web page and saves it to disk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_loader"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "requests-mock>=1.12",
    "ruff>=0.16",
]

[project.scripts]
page-loader = "page_loader.scripts.page_loader:main"
